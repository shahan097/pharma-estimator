name: Keep App Alive

on:
  schedule:
    # Har 4 ghante me ek baar run hoga taaki container warm rahe
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Pharma Estimator
        run: |
          # Real browser headers ke sath GET request bhejta hai taaki backend wake trigger ho
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --max-time 20 \
            "https://starmedi-estimator.streamlit.app/_stcore/health" || true

          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --max-time 20 \
            "https://starmedi-estimator.streamlit.app" > /dev/null || true

      - name: Ping Dental Notes
        run: |
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --max-time 20 \
            "https://dental-notes.streamlit.app/_stcore/health" || true

          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --max-time 20 \
            "https://dental-notes.streamlit.app/" > /dev/null || true
